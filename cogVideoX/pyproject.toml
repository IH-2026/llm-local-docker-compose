[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogvideox-local"
version = "1.0.0"
description = "A reusable Python library for generating videos with CogVideoX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.33.0",
    "diffusers>=0.30.1",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.1",
    "protobuf",
    "sentencepiece",
    "torch",
    "transformers>=4.44.0",
]

[project.scripts]
cogvideox = "cogvideox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
